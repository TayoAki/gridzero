name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test -p protocol -p importer -p tables -p engine -p storage -p wbhost
      - name: wbhost image builds
        run: docker build -f crates/wbhost/Dockerfile -t gridzero-wbhost .
      - name: wbhost image starts (still serving after 3 s; catches glibc/runtime mismatches)
        run: docker run --rm -e WB_TOKEN_SECRET=ci gridzero-wbhost sh -c 'timeout 3 wbhost; test $? -eq 124'

  web-and-control:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:8787
      WB_TOKEN_SECRET: ci-only-wb-token-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run typecheck
      - run: pnpm --filter @gridzero/web run build
      - run: pnpm --filter @gridzero/control test
      - name: Docker image builds
        run: docker build -t gridzero-control .

  # M1 + M2 acceptance suites: real control plane + release wbhost, full-size budgets
  # (100k-formula sheet, 5M-row CSV, 1M-row XLSX).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      E2E_RELEASE: "1"
      E2E_HEAVY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p wbhost
      - run: cargo build --release -p importer --features fixtures --bin gen-fixtures
      # The Python tests run inside the real sandbox.
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap python3-venv
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m venv services/sandbox/venv
          services/sandbox/venv/bin/pip install -r services/sandbox/requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gridzero/e2e test
