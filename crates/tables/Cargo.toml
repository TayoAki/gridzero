[package]
name = "tables"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
importer = { path = "../importer" }
polars = { version = "0.55.2", default-features = false, features = ["lazy", "parquet", "temporal", "dtype-date", "dtype-datetime", "strings", "fmt", "abs", "round_series", "log", "is_in", "concat_str", "regex", "unique_counts", "cov"] }
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
