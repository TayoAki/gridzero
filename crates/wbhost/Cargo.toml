[package]
name = "wbhost"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1"
engine = { path = "../engine" }
flate2 = "1.1"
futures-util = "0.3"
importer = { path = "../importer" }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
protocol = { path = "../protocol" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
storage = { path = "../storage" }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
